license="${mod_license}"

[[mods]] #mandatory

modId="${mod_id}" #mandatory

version="${mod_version}" #mandatory

displayName="${mod_name}" #mandatory

description='''
Foundation mod for the Kyngdoms suite: shared base classes and contracts meant to be hard-depended
on by every other mod, starting with the cross-mod menu-contribution system (any mod can register
a MenuContributor to add a tab to the shared "K" menu, with no pairwise dependency needed between
contributing mods).
'''

[[dependencies.${mod_id}]] #optional
    modId="neoforge" #mandatory
    type="required" #mandatory
    versionRange="[${neo_version},)" #mandatory
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Nuclyus' first-ever mixin, added 2026-11-16 for the single-sapling Dark Oak/Pale Oak growth fix --
# see worldgen.mixin.TreeGrowerMixin's own doc comment for why no event-based alternative covers
# this (no SaplingGrowTreeEvent or equivalent exists in this NeoForge version).
[[mixins]]
config="${mod_id}.mixins.json"
